<!-- ========================
     HERO
     ======================== -->
<section class="photo-hero">
  <img
    class="photo-hero-media"
    src="assets/images/photography/1785261471285-1280.webp"
    srcset="assets/images/photography/1785261471285-640.webp 640w, assets/images/photography/1785261471285-1280.webp 1280w, assets/images/photography/1785261471285-1920.webp 1920w"
    sizes="100vw"
    width="4096"
    height="3072"
    alt="雪山与云层的远景"
    decoding="async"
    fetchpriority="high"
  >
  <div class="photo-hero-shade"></div>
  <div class="photo-hero-top">
    <span>现场笔记 / 2025</span>
    <span>6 张照片 / 02 个地点</span>
  </div>
  <div class="photo-hero-inner">
    <div class="color-line"></div>
    <div class="photo-hero-label">摄影</div>
    <h1 class="photo-hero-title">光影<br><em>切片</em></h1>
    <p class="photo-hero-subtitle">把经过的地方留在光里，六个瞬间，来自昆明与乌鲁木齐</p>
  </div>
  <div class="photo-hero-side"><strong>01</strong><span>雨后山野</span></div>
  <div class="photo-hero-scroll">向下浏览</div>
</section>

<!-- ========================
     GALLERY
     ======================== -->
<div class="gallery-wrap">
  <div class="gallery-intro" data-border-glow data-border-glow-palette="warm" data-border-glow-radius="0" data-border-glow-fill=".12">
    <div>
      <div class="gallery-intro-kicker">胶片索引 / 01—06</div>
      <h2>视线从植物开始，<br>最后落在远山</h2>
    </div>
    <div class="gallery-intro-copy">
      不急着解释一张照片，让花、云、雪线和城市自己说话，像一卷还没有冲洗完的胶片
      <span class="gallery-intro-count">6 张照片 · 2025</span>
    </div>
  </div>
  <div class="gallery" id="gallery">
    <!-- Photos injected by JS -->
  </div>
  <div class="gallery-end"><span>胶卷末尾</span><span>继续观看</span></div>
</div>
